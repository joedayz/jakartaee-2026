# H2 Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:dcheroes

# Hibernate ORM (single default persistence unit)
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.packages=com.jakartaee.common.entities,com.jakartaee.jakartadata.entity
quarkus.hibernate-orm.log.sql=true

# Suppress split-package warning for _PanacheEntity stub
quarkus.arc.ignored-split-packages=io.quarkus.hibernate.orm.panache

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.jakartaee".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
